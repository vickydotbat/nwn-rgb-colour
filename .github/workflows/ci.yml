name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refuse a draft
        if: github.event.pull_request.draft
        run: |
          echo "draft: CI runs once the pull request is marked ready" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      # CI has no game install. The compiler needs the stock game data,
      # which Beamdog publishes in its server image.
      - name: Fetch the stock game data
        run: |
          id=$(docker create beamdog/nwserver:8193.34)
          mkdir -p "$RUNNER_TEMP/nwn"
          docker export "$id" | tar -x -C "$RUNNER_TEMP/nwn"
          key=$(find "$RUNNER_TEMP/nwn" -name nwn_base.key | head -1)
          test -n "$key"
          echo "NWN_ROOT=$(dirname "$(dirname "$key")")" >> "$GITHUB_ENV"
          # The compiler also wants a user folder, which a runner lacks.
          mkdir -p "$RUNNER_TEMP/nwn-user"
          echo "NWN_HOME=$RUNNER_TEMP/nwn-user" >> "$GITHUB_ENV"
      - name: Test
        run: nix develop -c just test
      - name: Compile
        run: nix develop -c just compile
